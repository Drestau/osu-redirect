<!DOCTYPE html>
<html>
<head>
    <title>osu! Redirect</title>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const time = urlParams.get('time');
            
            if (time) {
                // 1. Force the computer to open osu!
                window.location.href = "osu://edit/" + time;
                document.getElementById("message").innerText = "Launching osu! to " + time + " ...";
                
                // 2. Wait 3 seconds, then try to close the tab
                setTimeout(function() {
                    window.close();
                    
                    // 3. If the browser's security blocks the auto-close, change the text
                    document.getElementById("message").innerText = "osu! launched! You can safely close this tab.";
                }, 3000);

            } else {
                document.getElementById("message").innerText = "Error: No time provided.";
            }
        }
    </script>
</head>
<body style="background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding-top: 100px;">
    <h2 id="message">Loading...</h2>
</body>
</html>
